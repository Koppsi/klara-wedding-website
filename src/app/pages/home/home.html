<div class="hero-section">
  <div class="hero-overlay">
    <p class="subtitle">{{ 'HERO.SUBTITLE' | translate }}</p>
    <h1 class="date">{{ 'HERO.DATE' | translate }}</h1>
  </div>
</div>

<div class="container-centered grid-2-cols mt-4">
  
  <a routerLink="/details" class="hover-tile tile-details">
    <div class="tile-content">
      <span>{{ 'HEADER.MENU_DETAILS' | translate }}</span>
    </div>
  </a>

  <a routerLink="/rsvp" class="hover-tile tile-rsvp">
    <div class="tile-content">
      <span>{{ 'HEADER.MENU_RSVP' | translate }}</span>
    </div>
  </a>

  <a routerLink="/contact" class="hover-tile tile-contact">
    <div class="tile-content">
      <span>Contact</span> </div>
  </a>

  <a routerLink="/faqs" class="hover-tile tile-faq">
    <div class="tile-content">
      <span>FAQ</span>
    </div>
  </a>

</div>
