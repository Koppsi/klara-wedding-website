<div class="page-hero">
  <img src="assets/img/LakeLouise_quer.jpg" alt="FAQ Header" class="hero-bg-img">
  <div class="hero-overlay">
    <h1>{{ 'FAQS.TITLE' | translate }}</h1>
  </div>
</div>

<div class="container-centered">
  <div class="intro-box">
    <p>{{ 'FAQS.INTRO' | translate }}</p>
    <div class="separator-line"></div>
  </div>
</div>

<div class="container-centered faq-container">

  <div class="faq-list">
    @for (item of faqItems; track $index) {
      <div class="faq-item" [class.open]="item.isOpen">
        
        <div class="faq-question" (click)="toggleFaq($index)">
          <h3>{{ item.question | translate }}</h3>
          <span class="toggle-icon"></span>
        </div>

        <div class="faq-answer">
          <div class="answer-content">
            <p>{{ item.answer | translate }}</p>
          </div>
        </div>

      </div>
    }
  </div>

  <div class="still-questions">
    <p>{{ 'FAQS.STILL_QUESTIONS' | translate }} <a routerLink="/contact">{{ 'CONTACT.TITLE' | translate }}</a></p>
  </div>

</div>
